<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>DIVISI PRINTING - EXCELINDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .hidden-tab { display: none !important; }
  </style>
</head>
<body class="bg-[#F9F8F6] flex h-screen overflow-hidden">

  <!-- LOGIN MODAL (Muncul pertama kali) -->
  <div id="loginModal" class="fixed inset-0 bg-[#1E222D] z-[100] flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-96 space-y-4">
      <h2 class="text-xl font-bold text-center uppercase">LOGIN DIVISI PRINTING</h2>
      <input type="text" id="loginUsername" placeholder="Username" class="w-full p-3 border rounded-xl outline-none">
      <input type="password" id="loginPassword" placeholder="Password" class="w-full p-3 border rounded-xl outline-none">
      <button onclick="handleLogin()" class="w-full bg-[#E06D53] text-white py-3 rounded-xl font-bold uppercase">Masuk</button>
    </div>
  </div>

  <!-- Sidebar tetap sama seperti sebelumnya... (Pastikan class 'role-nav' ada) -->
  <aside class="w-64 bg-[#1E222D] text-gray-300 flex flex-col justify-between p-4 flex-shrink-0">
    <!-- Menu Navigasi... (Sama seperti desain terakhir) -->
  </aside>

  <main class="flex-1 overflow-y-auto p-8 max-w-7xl mx-auto space-y-8" id="mainContent">
    <!-- Semua Section Konten... -->
  </main>

  <script>
    // FUNGSI LOGIN SEDERHANA
    function handleLogin() {
      const user = document.getElementById('loginUsername').value;
      if (user) {
        document.getElementById('loginModal').classList.add('hidden');
        currentUser.name = user;
        document.getElementById('userNameDisplay').innerText = user;
      }
    }

    // MEMPERBAIKI BUG CLICK
    // Pastikan semua fungsi dipanggil dengan event listener yang benar
    document.addEventListener('DOMContentLoaded', () => {
      // Mengaktifkan kembali tombol yang sebelumnya tidak bisa diklik
      document.querySelectorAll('button').forEach(btn => {
        btn.style.pointerEvents = 'auto';
      });
    });

    // FUNGSI AKSES AMAN (Bukan "Harus SPV")
    function checkAccess(requiredRole) {
      // Sekarang setiap user bisa akses, hanya Syuja/Manager yang bisa Edit/Hapus PO
      return true; 
    }

    // Fungsi Render Tabel PO dengan fitur Search
    function renderPoTable() {
      const tbody = document.getElementById('po-table-body');
      const query = document.getElementById('searchPoInput').value.toLowerCase();
      tbody.innerHTML = '';
      
      poList.filter(p => p.number.toLowerCase().includes(query)).forEach(p => {
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="py-3 text-xs font-bold font-mono text-[#E06D53]">${p.number}</td>
            <td class="py-3 text-xs font-bold">${p.customer}</td>
            <td class="py-3 text-xs font-bold">${p.qty}</td>
            <td class="py-3 text-xs font-bold">${p.pic}</td>
            <td class="py-3"><span class="px-2 py-0.5 rounded bg-amber-100 text-amber-700">${p.priority}</span></td>
            <td class="py-3"><span class="px-2 py-0.5 rounded bg-blue-100 text-blue-700">${p.status}</span></td>
            <td class="py-3 text-xs space-x-2">
              <button onclick="openPOModal(${p.id})" class="text-blue-600 font-bold">EDIT</button>
              <button onclick="deletePO(${p.id})" class="text-red-600 font-bold">HAPUS</button>
            </td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
